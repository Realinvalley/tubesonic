<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1a"/>
      <stop offset="0.55" stop-color="#131a33"/>
      <stop offset="1" stop-color="#1c1230"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="1" stop-color="#ff5e3a"/>
    </linearGradient>
    <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="350" y1="0" x2="570" y2="0">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="1" stop-color="#ff5e3a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff2d55" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2d55" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

